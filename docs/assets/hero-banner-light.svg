<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">RelationNotes – NotebookLM &amp; RelationFlow Knowledge Studio</title>
  <desc id="hero-desc">Hero-Banner für RelationNotes: Quellengebundene KI-Forschung, Hybrid-RAG (D1 FTS5 + Int8 Vektoren), bidirektionale RelationFlow-Wissensgraphen und multimodales Studio auf Cloudflare Workers.</desc>
  <style>
    :root {
      color-scheme: light dark;
      --bg-primary: #FAF8F5;
      --bg-card: #FFFFFF;
      --text-primary: #141413;
      --text-secondary: #3D3935;
      --border-subtle: #334155;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #FAF8F5;
        --bg-card: #F8FAFC;
        --text-primary: #141413;
        --text-secondary: #475569;
        --border-subtle: #CBD5E1;
      }
    }
  </style>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F5" />
      <stop offset="55%" stop-color="#F3EFEA" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="#F8FAFC" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="380" rx="20" fill="url(#bgGrad)" />
  <rect width="1200" height="380" rx="20" fill="url(#grid)" opacity="0.45" />

  <!-- Decorative Knowledge Graph Constellation (Right Side) -->
  <g transform="translate(760, 48)">
    <rect x="0" y="0" width="392" height="284" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <text x="24" y="34" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">
      HYBRID-RAG × RELATIONFLOW KNOWLEDGE STUDIO
    </text>

    <!-- Graph Edges -->
    <line x1="95" y1="105" x2="205" y2="85" stroke="#0284C7" stroke-width="2" stroke-dasharray="5,4" />
    <line x1="95" y1="105" x2="185" y2="175" stroke="#D97706" stroke-width="2" />
    <line x1="205" y1="85" x2="315" y2="135" stroke="#4338CA" stroke-width="2" />
    <line x1="185" y1="175" x2="315" y2="135" stroke="#047857" stroke-width="2" />
    <line x1="185" y1="175" x2="295" y2="225" stroke="#D97706" stroke-width="2" stroke-dasharray="4,4" />

    <!-- Nodes -->
    <circle cx="95" cy="105" r="24" fill="#F8FAFC" stroke="#D97706" stroke-width="2.5" />
    <text x="95" y="109" text-anchor="middle" fill="#92400E" font-family="monospace" font-size="11" font-weight="700">[1] PDF</text>

    <circle cx="205" cy="85" r="26" fill="#F8FAFC" stroke="#0284C7" stroke-width="2.5" />
    <text x="205" y="89" text-anchor="middle" fill="#075985" font-family="monospace" font-size="11" font-weight="700">RRF k=60</text>

    <circle cx="185" cy="175" r="28" fill="#F8FAFC" stroke="#047857" stroke-width="2.5" />
    <text x="185" y="179" text-anchor="middle" fill="#065F46" font-family="monospace" font-size="11" font-weight="700">Graph</text>

    <circle cx="315" cy="135" r="26" fill="#F8FAFC" stroke="#4338CA" stroke-width="2.5" />
    <text x="315" y="139" text-anchor="middle" fill="#3730A3" font-family="monospace" font-size="11" font-weight="700">Audio</text>

    <circle cx="295" cy="225" r="22" fill="#F8FAFC" stroke="#BE185D" stroke-width="2.5" />
    <text x="295" y="229" text-anchor="middle" fill="#9D174D" font-family="monospace" font-size="10" font-weight="700">Quiz</text>

    <!-- Bottom Metric Pill inside Graph Card -->
    <rect x="24" y="236" width="225" height="30" rx="8" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1" />
    <text x="38" y="255" fill="#1E293B" font-family="monospace" font-size="11" font-weight="600">
      CPU &lt; 0.6ms | 100% Coverage | AAA
    </text>
  </g>

  <!-- Left Editorial Branding Column -->
  <g transform="translate(56, 58)">
    <!-- Eyebrow Pill -->
    <rect x="0" y="0" width="376" height="30" rx="15" fill="#F8FAFC" stroke="#D97706" stroke-width="1.2" />
    <circle cx="18" cy="15" r="5" fill="#D97706" />
    <text x="34" y="20" fill="#92400E" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.8">
      OPEN-SOURCE AI RESEARCH &amp; KNOWLEDGE STUDIO
    </text>

    <!-- Main Product Title -->
    <text x="0" y="96" fill="#141413" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="700" letter-spacing="-1">
      RelationNotes
    </text>

    <!-- Subtitle -->
    <text x="0" y="136" fill="url(#accentAmber)" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="600">
      NotebookLM &amp; RelationFlow Knowledge Studio
    </text>

    <!-- Value Proposition Copy -->
    <text x="0" y="178" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15.5">
      Quellengebundene KI-Synthese mit absatzgenauen Inline-Zitaten, lokalem Hybrid-RAG
    </text>
    <text x="0" y="202" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15.5">
      (Cloudflare D1 FTS5 + Int8-Vektoren), Zwei-Host-Audio-Overview und bidirektionaler
    </text>
    <text x="0" y="226" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="15.5">
      Wissensgraph-Brücke zu RelationFlow – 100 % lauffähig im Cloudflare Free Tier.
    </text>

    <!-- Feature Badges Row -->
    <g transform="translate(0, 254)">
      <rect x="0" y="0" width="154" height="34" rx="8" fill="#FFFFFF" stroke="#0284C7" stroke-width="1.2" />
      <text x="77" y="21" text-anchor="middle" fill="#075985" font-family="monospace" font-size="12" font-weight="700">Cloudflare Edge</text>

      <rect x="168" y="0" width="158" height="34" rx="8" fill="#FFFFFF" stroke="#047857" stroke-width="1.2" />
      <text x="247" y="21" text-anchor="middle" fill="#065F46" font-family="monospace" font-size="12" font-weight="700">WCAG 2.2 Level AAA</text>

      <rect x="340" y="0" width="154" height="34" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2" />
      <text x="417" y="21" text-anchor="middle" fill="#92400E" font-family="monospace" font-size="12" font-weight="700">DSGVO &amp; EU AI Act</text>

      <rect x="508" y="0" width="158" height="34" rx="8" fill="#FFFFFF" stroke="#4338CA" stroke-width="1.2" />
      <text x="587" y="21" text-anchor="middle" fill="#3730A3" font-family="monospace" font-size="12" font-weight="700">OpenSSF Hardened</text>
    </g>
  </g>
</svg>
