services:
  app:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    ports:
      - "8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - APP_PROFILE=full
      - APP_ORIGIN=http://localhost:8787
    volumes:
      - app-data:/app/.data
    restart: unless-stopped

volumes:
  app-data:
