name: Deploy (manuelle Freigabe)

# Deploy nur von Hand und nur nach Freigabe im GitHub Environment "production"
# (Settings > Environments > production > Required reviewers). Kein automatischer Deploy.
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "D1-Migrationen vor dem Deploy remote anwenden"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy auf Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Konfiguration des Inhabers prüfen
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEPLOY_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} ist im Environment 'production' nicht gesetzt."
              missing=1
            fi
          done
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000001"' apps/worker/wrangler.jsonc; then
            echo "::error::apps/worker/wrangler.jsonc enthält noch die Platzhalter-database_id."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Tests vor dem Deploy
        run: pnpm test

      - name: Web-Oberfläche bauen
        run: pnpm --filter @notebook-lm/web build

      - name: D1-Migrationen remote anwenden
        if: ${{ inputs.run_migrations }}
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply notebook-lm-db --remote

      - name: Worker deployen
        working-directory: apps/worker
        run: pnpm exec wrangler deploy

      - name: Smoke-Check gegen die Deploy-URL
        working-directory: apps/worker
        run: pnpm exec tsx src/smoke-check.ts "$DEPLOY_URL"
