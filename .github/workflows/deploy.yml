name: Deploy (manuelle Freigabe)

# Deploy nur von Hand und nur nach Freigabe im GitHub Environment "production"
# (Settings > Environments > production > Required reviewers). Kein automatischer Deploy.
on:
  workflow_dispatch:
    inputs:
      run_migrations:
        description: "D1-Migrationen vor dem Deploy remote anwenden"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy auf Cloudflare Workers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEPLOY_URL: ${{ vars.DEPLOY_URL }}
      # Öffentlicher Turnstile-Site-Key (kein Geheimnis), wird in die Web-Oberfläche eingebaut.
      VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Konfiguration des Inhabers prüfen
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID DEPLOY_URL VITE_TURNSTILE_SITE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::${name} ist im Environment 'production' nicht gesetzt."
              missing=1
            fi
          done
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000001"' apps/worker/wrangler.jsonc; then
            echo "::error::apps/worker/wrangler.jsonc enthält noch die Platzhalter-database_id."
            missing=1
          fi
          # APP_ORIGIN (CSRF-Origin, Passkey-RP-ID, Turnstile) muss genau die Deploy-Adresse sein.
          app_origin="$(grep -o '"APP_ORIGIN": *"[^"]*"' apps/worker/wrangler.jsonc | sed 's/.*: *"\(.*\)"/\1/')"
          case "$app_origin" in
            https://*) ;;
            *)
              echo "::error::APP_ORIGIN in apps/worker/wrangler.jsonc ist keine HTTPS-Adresse (${app_origin:-leer})."
              missing=1
              ;;
          esac
          if [ -n "$DEPLOY_URL" ] && [ "${DEPLOY_URL%/}" != "$app_origin" ]; then
            echo "::error::DEPLOY_URL (${DEPLOY_URL}) stimmt nicht mit APP_ORIGIN (${app_origin}) überein."
            missing=1
          fi
          exit "$missing"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Fehlende Worker-Secrets früh melden, bevor Migrationen laufen. Es werden nur Namen gelesen.
      # Schlägt die Abfrage selbst fehl (z. B. Netzwerk), wird nur gewarnt; der Smoke-Check
      # fängt fehlende Secrets danach über 503 ab.
      - name: Worker-Secrets prüfen
        working-directory: apps/worker
        run: |
          set -o pipefail
          if ! names="$(pnpm exec wrangler secret list --format json | jq -r '.[].name')"; then
            echo "::warning::Worker-Secrets konnten nicht gelesen werden, Prüfung übersprungen."
            exit 0
          fi
          missing=0
          for name in TURNSTILE_SECRET_KEY SESSION_SALT_SECRET DEMO_GEMINI_KEY; do
            if ! printf '%s\n' "$names" | grep -qx "$name"; then
              echo "::error::Worker-Secret ${name} fehlt (wrangler secret put ${name})."
              missing=1
            fi
          done
          if ! printf '%s\n' "$names" | grep -Eqx 'KEK_V[0-9]+|BYOK_MASTER_KEY'; then
            echo "::error::Worker-Secret KEK_V1 fehlt (wrangler secret put KEK_V1)."
            missing=1
          fi
          exit "$missing"

      - name: Tests vor dem Deploy
        run: pnpm test

      - name: Web-Oberfläche bauen
        env:
          VITE_PUBLIC_BASE_URL: ${{ vars.DEPLOY_URL }}
        run: pnpm --filter @notebook-lm/web build

      - name: D1-Migrationen remote anwenden
        if: ${{ inputs.run_migrations }}
        working-directory: apps/worker
        run: pnpm exec wrangler d1 migrations apply notebook-lm-db --remote

      - name: Worker deployen
        working-directory: apps/worker
        run: pnpm exec wrangler deploy

      - name: Smoke-Check gegen die Deploy-URL
        working-directory: apps/worker
        # Bis zu drei Versuche: direkt nach dem Deploy braucht die Verteilung manchmal Sekunden.
        run: |
          for attempt in 1 2 3; do
            if pnpm exec tsx src/smoke-check.ts "$DEPLOY_URL"; then
              exit 0
            fi
            echo "Smoke-Check Versuch ${attempt} fehlgeschlagen."
            [ "$attempt" -lt 3 ] && sleep 15
          done
          exit 1
