name: Release (signiert, SBOM, Provenance)

# Veröffentlicht nur bei einem Tag v*.*.* und erst nach Freigabe im Environment "release".
# workflow_dispatch ist ein Probelauf: baut, erzeugt SBOM und Changelog als Workflow-Artefakt,
# attestiert, signiert und veröffentlicht aber nichts.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, SBOM und Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Version bestimmen und gegen den Tag prüfen
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" != "v${version}" ]; then
            echo "::error::Tag ${REF_NAME} passt nicht zur Version ${version} in package.json."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Tests mit Coverage-Schwelle
        run: pnpm test:coverage

      - name: Produktions-Build
        run: pnpm build

      - name: Release-Dateien packen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@$(git log -1 --format=%ct)" \
            -czf "release/notebook-lm-klon-web-${VERSION}.tar.gz" -C apps/web/dist .
          git archive --format=tar.gz --prefix="notebook-lm-klon-${VERSION}/" \
            -o "release/notebook-lm-klon-${VERSION}-source.tar.gz" HEAD

      - name: SBOM (CycloneDX) erzeugen
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: release/notebook-lm-klon-${{ steps.version.outputs.version }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Changelog aus Commits erzeugen
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          previous="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)"
          range="HEAD"
          if [ -n "$previous" ]; then range="${previous}..HEAD"; fi
          {
            echo "## Änderungen in ${VERSION}"
            echo
            git log --no-merges --pretty='- %s (%h)' "$range"
          } > "release/CHANGELOG-${VERSION}.md"

      - name: Prüfsummen
        working-directory: release
        run: sha256sum -- * > SHA256SUMS.txt

      - name: Release-Dateien als Workflow-Artefakt ablegen
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Attestieren, signieren und veröffentlichen
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Release-Dateien laden
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: SLSA-Build-Provenance attestieren
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "release/*.tar.gz"

      - name: SBOM an das Web-Paket attestieren
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: release/notebook-lm-klon-web-${{ needs.build.outputs.version }}.tar.gz
          sbom-path: release/notebook-lm-klon-${{ needs.build.outputs.version }}.cdx.json

      - name: Cosign installieren
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Mit Sigstore signieren (keyless)
        working-directory: release
        run: |
          for file in *.tar.gz *.cdx.json SHA256SUMS.txt; do
            cosign sign-blob --yes --bundle "${file}.sigstore.json" "$file"
          done

      - name: GitHub-Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$REPO" \
            --verify-tag \
            --title "Notebook-LM-Klon ${VERSION}" \
            --notes-file "release/CHANGELOG-${VERSION}.md"
