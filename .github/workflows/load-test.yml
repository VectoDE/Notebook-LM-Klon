name: Lasttest – k6 lokal gegen wrangler dev

# Läuft nicht bei jedem PR, sondern manuell, bei Änderungen am Lasttest selbst und
# wöchentlich. Die Reports (HTML, JSON) liegen als Workflow-Artefakt "load-test-report".
# Optional: Eingabe "live_url" startet zusätzlich den kleinen Live-Rauchtest (2-5 VUs,
# nur lesende, öffentliche Endpunkte, keine Konten, keine KI-Aufrufe).

on:
  workflow_dispatch:
    inputs:
      peak_vus:
        description: "Gleichzeitige simulierte Nutzer in der Spitze (lokal)"
        default: "200"
        required: false
      live_url:
        description: "Optional: Live-URL für den Rauchtest (leer = überspringen)"
        default: ""
        required: false
  pull_request:
    branches: ["main"]
    paths:
      - "load-test/**"
      - ".github/workflows/load-test.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  K6_VERSION: "1.8.2"
  # SHA-256 aus k6-v1.8.2-checksums.txt des offiziellen Releases (github.com/grafana/k6).
  K6_LINUX_AMD64_SHA256: "37620781d35406ebf402397a6c5cf4adb62d175cb052ff45325ae0b860527063"

jobs:
  k6-local:
    name: k6 lokal (wrangler dev) und optionaler Live-Rauchtest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Build Web-Assets (werden vom Worker ausgeliefert)
        run: pnpm build

      - name: Install k6 (offizielles Release, SHA-256 geprüft)
        run: |
          set -euo pipefail
          archive="k6-v${K6_VERSION}-linux-amd64.tar.gz"
          curl -sSfL -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/grafana/k6/releases/download/v${K6_VERSION}/${archive}"
          echo "${K6_LINUX_AMD64_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/k6"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/k6" --strip-components=1
          echo "K6_BIN=${RUNNER_TEMP}/k6/k6" >> "$GITHUB_ENV"

      - name: Lasttest lokal (wrangler dev, viele simulierte Nutzer)
        env:
          PEAK_VUS: ${{ inputs.peak_vus || '200' }}
        run: node load-test/run-local.mjs --out load-test/results --peak "$PEAK_VUS" --hold 90s

      - name: Live-Rauchtest (nur wenn live_url gesetzt)
        if: ${{ inputs.live_url != '' }}
        env:
          LIVE_URL: ${{ inputs.live_url }}
        run: |
          K6_VERSION_TEXT="$("$K6_BIN" version)"
          "$K6_BIN" run load-test/k6/scenarios.js \
            -e PROFILE=smoke -e BASE_URL="$LIVE_URL" -e SMOKE_VUS=3 -e SMOKE_DURATION=30s \
            -e REPORT_DIR=load-test/results -e K6_VERSION="$K6_VERSION_TEXT"
          node load-test/render-report.mjs load-test/results/summary-smoke.json             load-test/results/report-smoke.html

      - name: Upload Lasttest-Reports
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: load-test-report
          path: load-test/results/
          if-no-files-found: warn
          retention-days: 30
