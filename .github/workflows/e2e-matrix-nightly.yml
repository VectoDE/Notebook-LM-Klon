name: E2E-Matrix nightly (Dev-Kanäle, WebKit auf macOS)

# Nicht blockierend: kein Pflicht-Check. Der Dev-Kanal von Edge ist instabil und kann
# Fehlalarme erzeugen. Er zeigt kommende Änderungen früh (Issue #431, Option B). Chrome Dev ist
# über Playwright nicht installierbar (siehe docs/browser-kompatibilitaet.md).
on:
  schedule:
    - cron: "43 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-nightly:
    name: Nightly (${{ matrix.project }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: msedge-dev, install: msedge-dev, os: ubuntu-latest }
          - { project: chrome-beta, install: chrome-beta, os: ubuntu-latest }
          - { project: msedge-beta, install: msedge-beta, os: ubuntu-latest }
          - { project: webkit, install: webkit, os: macos-latest }
          - { project: phone-ios, install: webkit, os: macos-latest }
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Install browser (${{ matrix.install }})
        run: pnpm --filter @notebook-lm/web exec playwright install --with-deps ${{ matrix.install }}

      - name: Run Playwright matrix project
        run: pnpm --filter @notebook-lm/web test:e2e --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report-${{ matrix.project }}-${{ matrix.os }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: warn
          retention-days: 14
